<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sing Along at the Ladies Sangeet</title>
    <meta
      name="description"
      content="A collection of traditional Punjabi wedding songs, with lyrics in Hindi and English scripts. Available on Amazon worldwide."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Gilda+Display&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="btn" href="#order">Order Now</a>
    </header>

    <main>
      <section id="home" class="hero">
        <h1 class="visually-hidden">Sing Along at the Ladies Sangeet</h1>
        <img
          class="hero-image"
          src="images/home-1200.jpg"
          srcset="images/home-1200.jpg 1200w, images/home-2400.jpg 2400w"
          sizes="100vw"
          width="2400"
          height="1791"
          alt="Sing Along at the Ladies Sangeet: popular Punjabi wedding songs. A grandmother, a young girl and four women in pastel outfits sing and clap around a dholak."
        />
      </section>

      <section id="order" class="order">
        <h2>Get your copy today!</h2>

        <div class="order-layout">
          <img
            class="order-photo"
            src="images/book-closeup-1.jpg"
            width="960"
            height="1280"
            loading="lazy"
            alt="A hand holding a copy of Sing Along at the Ladies Sangeet, with a stack of more copies on a wooden table behind it."
          />

          <div class="order-options">
            <div class="order-option">
              <h3>For You</h3>
              <p>Order your personal copy on Amazon, shipping in India and globally.</p>
              <button class="btn" type="button" data-href="https://amzn.in/d/03upyuNi">
                Amazon.in
              </button>
              <button class="btn" type="button" data-href="https://a.co/d/0hREu7Y6">
                Amazon.com
              </button>
            </div>

            <div class="order-option">
              <h3>For Your Sangeet!</h3>
              <p>
                Planning a wedding? Perfect for distributing at sangeet ceremonies or gifting to
                guests.
              </p>
              <button
                class="btn"
                type="button"
                data-href="https://store.whitefalconpublishing.com/products/sing-along-at-the-ladies-sangeet-popular-punjabi-wedding-songs"
              >
                Bulk Orders Here
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; <span id="year">2026</span> Sing Along at the Ladies Sangeet</p>
    </footer>

    <script src="js/main.js"></script>
  </body>
</html>
